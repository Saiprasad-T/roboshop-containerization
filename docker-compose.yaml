services:
  catalogue:
    build:
      context: ./catalogue
      dockerfile: Dockerfile
    image: saithota9/catalogue:1.0.0
    depends_on:
      - mongodb
    networks:
     - roboshop

  cart:
    build:
      context: ./cart
      dockerfile: Dockerfile
    image: saithota9/cart:1.0.0
    depends_on:
      - redis
    networks:
     - roboshop

  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    image: saithota9/payment:1.0.0
    depends_on:
      - mysql
    networks:
     - roboshop

  shipping:
    build:
      context: ./shipping
      dockerfile: Dockerfile
    image: saithota9/shipping:1.0.0
    depends_on:
      - mysql
    networks:
     - roboshop
  
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    image: saithota9/user:1.0.0
    depends_on:
      - mongodb
      - redis
    networks:
     - roboshop

  frontend:
    build:
     context: ./frontend
     dockerfile: Dockerfile
    image: saithota9/frontend:1.0.0
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment
    networks:
     - roboshop
  mongodb:
   build: ./mongodb  
   image : saithota9/mongodb:1.0.0
   container_name: mongodb
   networks:
     - roboshop

  mysql:
   build: ./mysql
   image : saithota9/mysql:1.0.0
   container_name: mysqldb
   networks:
     - roboshop
  rabbitmq:
   build: ./rabbitmq  
   image : saithota9/rabbitmq:1.0.0
   container_name: rabbitmq
   networks:
     - roboshop
   
  redis:
   build: ./redis
   image: saithota9/redis:1.0.0
   container_name: redis
   networks:
     - roboshop
   
networks:
  roboshop:
    external: false